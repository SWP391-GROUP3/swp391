spring.application.name=swp391-kpi-server
server.port=8080

# Cau hinh ket noi DB nam trong application-local.properties (KHONG commit).
# Copy application-local.properties.example -> application-local.properties roi sua.
spring.profiles.active=local

# ---------------------------------------------------------------------------
# JPA
# ---------------------------------------------------------------------------
# validate = Hibernate CHI kiem tra entity co khop schema khong, KHONG tu sua DB.
# TUYET DOI khong doi thanh update: 5 nguoi sua entity song song se lam
# schema moi may mot khac, cot cu khong bi xoa, va khong ai biet DB that co gi.
# Doi schema -> sua database/schema.sql -> bao ca nhom chay lai trong SSMS.
spring.jpa.hibernate.ddl-auto=validate

# Tat open-in-view: buoc phai load du lieu trong service va tra ve DTO,
# thay vi de JPA lazy-load luc render. Bat len thi de dinh loi N+1 query.
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Log - bat khi can xem cau SQL that su chay
# ---------------------------------------------------------------------------
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ---------------------------------------------------------------------------
# Tra ve loi dang JSON co message, thay vi trang loi HTML mac dinh
# ---------------------------------------------------------------------------
server.error.include-message=always
server.error.include-binding-errors=always
