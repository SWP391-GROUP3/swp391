  <path class="ln" d="M578,800 H776"/>
  <text class="g" x="690" y="793">Có</text>
  <text class="g" x="567" y="838">Không</text>
  <path class="ln" d="M560,818 V856"/>

  <rect class="act" x="780" y="777" width="150" height="46" rx="12"/>
  <text class="t" x="855" y="805">Tạm giữ dòng tiền</text>

