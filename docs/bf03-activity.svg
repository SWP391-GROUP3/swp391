  <path d="M930,564 H948 V1052 H582" stroke="#000" stroke-width="1.1" fill="none" marker-end="url(#a)"/>
  <path d="M930,800 H948" stroke="#000" stroke-width="1.1" fill="none"/>

  <rect class="alg" x="475" y="1112" width="170" height="52" rx="12"/>
  <text class="t" x="560" y="1133" font-weight="700">★ Tính kết quả KPI</text>
  <text class="t" x="560" y="1147" font-weight="700">từng người</text>
  <path class="ln" d="M560,1164 V1194"/>

  <rect class="act" x="475" y="1198" width="170" height="46" rx="12"/>
  <text class="t" x="560" y="1226">Kết thúc job</text>
  <path class="ln" d="M560,1244 V1286"/>

  <circle cx="560" cy="1300" r="13" fill="#FFFFFF" stroke="#000" stroke-width="1.4"/>
  <circle cx="560" cy="1300" r="8" fill="#000"/>

  <path d="M930,236 H968 V1300 H575" stroke="#000" stroke-width="1.1" fill="none" marker-end="url(#a)"/>

  <rect class="act" x="30" y="1330" width="20" height="14" rx="4"/>
  <text x="58" y="1341" font-size="10.5" fill="#333">bước xử lý</text>
  <rect class="alg" x="150" y="1330" width="20" height="14" rx="4"/>
  <text x="178" y="1341" font-size="10.5" fill="#333">★ thuật toán lõi</text>
  <polygon class="dia" points="300,1330 312,1337 300,1344 288,1337"/>
  <text x="320" y="1341" font-size="10.5" fill="#333">điểm rẽ nhánh</text>
  <circle cx="440" cy="1337" r="7" fill="#000"/>
  <text x="454" y="1341" font-size="10.5" fill="#333">bắt đầu</text>
  <circle cx="530" cy="1337" r="8" fill="#FFF" stroke="#000" stroke-width="1.2"/>
  <circle cx="530" cy="1337" r="5" fill="#000"/>
  <text x="544" y="1341" font-size="10.5" fill="#333">kết thúc</text>
