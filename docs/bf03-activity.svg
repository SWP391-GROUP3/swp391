    .dia { fill:#9DD9F3; stroke:#1F6FB2; stroke-width:1.2; }
    .t   { font-size:11px; fill:#000; text-anchor:middle; }
    .q   { font-size:10.5px; fill:#000; text-anchor:end; }
    .g   { font-size:10.5px; fill:#000; }
    .ln  { stroke:#000; stroke-width:1.1; fill:none; marker-end:url(#a); }
    .lane{ fill:none; stroke:#3A3A3A; stroke-width:1; }
    .hdr { fill:#FFFFFF; stroke:#3A3A3A; stroke-width:1; }
    .hn  { font-size:12px; fill:#000; text-anchor:middle; }
  </style>

  <rect width="1000" height="1400" fill="#FFFFFF"/>

  <rect x="10" y="10" width="980" height="1380" fill="none" stroke="#2E5FA3" stroke-width="1.4"/>
  <path d="M10,10 H300 V30 L288,42 H10 Z" fill="#FFFFFF" stroke="#2E5FA3" stroke-width="1.4"/>
  <text x="20" y="30" font-size="11.5" fill="#000">act [BF-03 Tính KPI &amp; nhuận bút theo kỳ]</text>

  <rect class="hdr" x="20" y="52" width="320" height="26"/>
